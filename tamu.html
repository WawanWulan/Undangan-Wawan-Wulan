<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Tamu — Wawan & Wulan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ee;color:#4d403b;font-family:Poppins,sans-serif}
.container{max-width:1000px;margin:auto;padding:40px 18px}
h1,h2{font-family:"Cormorant Garamond",serif}
h1{font-size:48px;margin:0}
.card{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 10px 35px #0000000d}
input{width:100%;padding:12px;border:1px solid #d7cbc3;border-radius:10px;font:inherit}
.row{display:flex;gap:10px;align-items:center;margin:12px 0}
.name{flex:1;font-weight:500}
.url{flex:2;font-size:12px;color:#806f67;word-break:break-all}
button{border:0;background:#73584e;color:#fff;padding:10px 15px;border-radius:22px;font:inherit;cursor:pointer;white-space:nowrap}
button:hover{opacity:.9}
.note{font-size:13px;line-height:1.7;color:#756862}
@media(max-width:700px){.row{display:block}.url{margin:8px 0}.row button{margin-right:5px;margin-bottom:5px}}
</style>
</head>
<body>
<div class="container">
  <h1>Daftar Tamu</h1>
  <p class="note">
    Halaman ini membaca data dari <b>tamu.json</b>. Untuk menambah tamu secara permanen,
    tambahkan pasangan <b>slug : nama</b> di file tersebut lalu push ke GitHub.
  </p>

  <div class="card">
    <h2>Tambah / Cek Link</h2>
    <input id="guestInput" placeholder="Contoh: Budi Santoso">
    <p><button id="generateBtn">Buat Link</button></p>
    <div id="generated"></div>
  </div>

  <div class="card">
    <h2>Daftar Tamu</h2>
    <div id="guestList">Memuat...</div>
  </div>
</div>

<script>
const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^/]*$/, "/");

function slugify(value){
  return String(value).toLowerCase().trim()
    .normalize("NFD").replace(/[\\u0300-\\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>alert("Link berhasil disalin!"));
  }else{
    const area=document.createElement("textarea");
    area.value=text; document.body.appendChild(area); area.select();
    document.execCommand("copy"); document.body.removeChild(area);
    alert("Link berhasil disalin!");
  }
}

function makeRow(slug,name){
  const url=baseUrl+"?to="+encodeURIComponent(slug);
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=
    '<div class="name"></div>'+
    '<div class="url"></div>'+
    '<button>Salin Link</button>'+
    '<button>WhatsApp</button>';
  row.querySelector(".name").textContent=name;
  row.querySelector(".url").textContent=url;
  row.querySelectorAll("button")[0].onclick=()=>copyText(url);
  row.querySelectorAll("button")[1].onclick=()=>{
    const text=`Undangan pernikahan Wawan & Wulan untuk ${name}: ${url}`;
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  };
  return row;
}

async function loadGuests(){
  const list=document.getElementById("guestList");
  try{
    const res=await fetch("./tamu.json",{cache:"no-store"});
    if(!res.ok) throw new Error();
    const guests=await res.json();
    list.innerHTML="";
    Object.entries(guests).forEach(([slug,name])=>{
      list.appendChild(makeRow(slug,name));
    });
  }catch(e){
    list.textContent="Gagal membaca tamu.json.";
  }
}

document.getElementById("generateBtn").onclick=()=>{
  const name=document.getElementById("guestInput").value.trim();
  if(!name){alert("Masukkan nama tamu.");return;}
  const slug=slugify(name);
  const url=baseUrl+"?to="+encodeURIComponent(slug);
  const box=document.getElementById("generated");
  box.innerHTML="";
  box.appendChild(makeRow(slug,name));
};

loadGuests();
</script>
</body>
</html>
